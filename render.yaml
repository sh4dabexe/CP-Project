services:
  - type: web
    name: number-duel-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --chdir backend app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: Firebase_api_key
        sync: false
    healthCheckPath: /api/health
